<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="03-plan-adaptation"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#40505c"/></marker></defs><rect x="20" y="43" width="280" height="82" fill="#f7f7f7" stroke="#40505c" stroke-width="1.3"/><text x="160.0" y="62.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">TRAIN subgraph A: transfer</text><text x="160.0" y="80.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">grasp -&gt; move -&gt; place</text><text x="160.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">item / target roles</text><text x="160.0" y="116.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">failure -&gt; observe -&gt; retry</text><rect x="360" y="43" width="280" height="82" fill="#f7f7f7" stroke="#40505c" stroke-width="1.3"/><text x="500.0" y="71.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">TRAIN subgraph B: open</text><text x="500.0" y="89.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">approach(handle) -&gt; pull(drawer)</text><text x="500.0" y="107.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">verify open(drawer)</text><rect x="720" y="43" width="260" height="82" fill="#f7f7f7" stroke="#40505c" stroke-width="1.3"/><text x="850.0" y="71.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">UNSEEN composition</text><text x="850.0" y="89.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">put cup in closed drawer</text><text x="850.0" y="107.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">current cup / handle / drawer</text><rect x="200" y="185" width="600" height="65" fill="#eaf1f6" stroke="#40505c" stroke-width="1.3"/><text x="500.0" y="204.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">ALIGN + EDIT + VALIDATE</text><text x="500.0" y="222.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">item = current cup; target = current drawer</text><text x="500.0" y="240.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">insert opening prerequisite; ground geometry; check capabilities</text><rect x="20" y="304" width="185" height="66" fill="#f7f7f7" stroke="#40505c" stroke-width="1.3"/><text x="112.5" y="324.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">Open drawer</text><text x="112.5" y="342.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">verify open(drawer)</text><text x="112.5" y="360.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">release handle</text><rect x="270" y="304" width="185" height="66" fill="#eaf1f6" stroke="#40505c" stroke-width="1.3"/><text x="362.5" y="333.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">Grasp cup</text><text x="362.5" y="351.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">verify holding(cup)</text><rect x="535" y="304" width="185" height="66" fill="#f7f7f7" stroke="#40505c" stroke-width="1.3"/><text x="627.5" y="333.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">Move cup</text><text x="627.5" y="351.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">check live geometry</text><rect x="795" y="304" width="185" height="66" fill="#f7f7f7" stroke="#40505c" stroke-width="1.3"/><text x="887.5" y="333.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">Place cup</text><text x="887.5" y="351.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">verify in(cup, drawer)</text><rect x="270" y="402" width="185" height="58" fill="#f7f7f7" stroke="#40505c" stroke-width="1.3"/><text x="362.5" y="418.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">Reobserve + retry</text><text x="362.5" y="436.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">approved budget only</text><text x="362.5" y="454.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#17202a">new attempt ID</text><polyline points="160,125 160,217 200,217" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="500,125 500,185" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="850,125 850,217 800,217" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="500,250 500,278 113,278 113,304" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="265" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#17202a">validated plan</text><polyline points="205,337 270,337" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="455,337 535,337" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="491" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#17202a">holding</text><polyline points="720,337 795,337" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="362,370 362,402" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="7 4"/><text x="402" y="387" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#17202a">failed</text><polyline points="455,431 490,431 490,357 455,357" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="7 4