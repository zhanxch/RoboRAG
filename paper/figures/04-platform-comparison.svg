<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="04-platform-comparison"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#40505c"/></marker></defs><rect x="210" y="34" width="580" height="66" fill="#f7f7f7" stroke="#40505c" stroke-width="1.3"/><text x="500.0" y="63.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">FIXED WITHIN EACH BACKEND</text><text x="500.0" y="81.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">planner + graph bank + observations + task instances + local controller</text><rect x="20" y="152" width="280" height="83" fill="#f7f7f7" stroke="#40505c" stroke-width="1.3"/><text x="160.0" y="180.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">A. Backend-specific native driver</text><text x="160.0" y="198.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">backend-specific tool signatures</text><text x="160.0" y="216.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">local/native calls</text><rect x="360" y="152" width="280" height="83" fill="#eaf1f6" stroke="#40505c" stroke-width="1.3"/><text x="500.0" y="180.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">B. Shared contract, direct calls</text><text x="500.0" y="198.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">common semantics + adapter</text><text x="500.0" y="216.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">local/native calls</text><rect x="700" y="152" width="280" height="83" fill="#eaf1f6" stroke="#40505c" stroke-width="1.3"/><text x="840.0" y="180.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">C. Shared contract, MCP</text><text x="840.0" y="198.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">same semantics + same adapter</text><text x="840.0" y="216.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">MCP discovery + transport</text><rect x="210" y="289" width="580" height="66" fill="#f7f7f7" stroke="#40505c" stroke-width="1.3"/><text x="500.0" y="309.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">EVALUATE EACH BACKEND SEPARATELY</text><text x="500.0" y="327.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">RoboDojo  |  LIBERO  |  real robot</text><text x="500.0" y="345.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17202a">backend-specific capabilities and physical execution</text><polyline points="500,100 500,126 160,126 160,152" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="500,100 500,152" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="500,126 840,126 840,152" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="160,235 160,322 210,322" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="500,235 500,289" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="840,235 840,322 790,322" fill="none" stroke="#40505c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="20" y="15" font-family="Arial,sans-serif" font-size="15" fill="#17202a">SEPARATE INTERFACE REUSE FROM THE EFFECT OF MCP</text><text x="20" y="388" font-family="Arial,sans-serif" font-size="15" fill="#17202a">B - A: reuse / semantic consistency     C - B: discovery / transport overhead</text><text x="20" y="410" font-family="Arial,sans-serif" font-size="13" fill="#17202a">Report task success, conformance, application edits and latency for each backend.</text></svg>